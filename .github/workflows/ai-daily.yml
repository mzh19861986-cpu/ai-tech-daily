name: AI Daily Reports

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）跑一次
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

concurrency:
  group: ai-daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test DeepSeek connectivity
        run: |
          echo "Testing DeepSeek API connectivity..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://api.deepseek.com/v1/models || echo "curl failed"
          curl -s https://api.deepseek.com/v1/models -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" | head -c 200 || echo "API call failed"

      - name: Run All Pipelines
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEY_2: ${{ secrets.DEEPSEEK_API_KEY_2 }}
          DEEPSEEK_API_KEY_3: ${{ secrets.DEEPSEEK_API_KEY_3 }}
          DEEPSEEK_API_KEY_4: ${{ secrets.DEEPSEEK_API_KEY_4 }}
          DEEPSEEK_BASE_URL: "https://api.deepseek.com/v1"
          DEEPSEEK_MODEL: "deepseek-chat"
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DB_PATH: data/agent.db
        run: python -m src.agent.main --all

      - name: Commit generated reports
        run: |
          git config user.name "ai-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/ data/ || true
          git diff --staged --quiet || git commit -m "chore: daily AI reports $(date -u +%Y-%m-%d)"
          git push

      - name: Build static site
        run: |
          pip install markdown pygments
          python scripts/build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: run-agent
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
